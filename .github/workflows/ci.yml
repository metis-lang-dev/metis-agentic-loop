name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The extensions against stand-ins (no model, no GPU): test/extensions.test.ts.
  # The stand-in metis forwards --tools-json to the real metispy; the domain
  # tools read the catalog through the python the domain agent would use.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-agentic-loop
      - name: Checkout metispy (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: Checkout metis-catalog (public)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          path: metis-catalog
      # the domain agent (public): the domain tools' sessions over the selected packages run it —
      # example/seeded.ts on love_triangle and on nav, love_triangle's and nav's domain tools,
      # wildfire's episodes; they skipped without it
      - name: Checkout metis-agent (public; the domain agent the domain tools run)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-agent
          path: metis-agent
      - name: Checkout metis-lang (public; metisc checks a catalog_edit of a program)
        uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          path: metis-lang
      - name: Install OCaml + build metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
          echo "METISC=$GITHUB_WORKSPACE/metis-lang/src/metisc" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metispy, metis-catalog and the loop SDK at its tag
        run: |
          pip install ./metispy ./metis-catalog
          # sdk-v0.1.4: the catalog CLI's intents --spec (metis-loop 21bfc02), the
          # OpenAI-compatible face formalize uses on OpenRouter (metis-loop 7932969),
          # take, catalog_take's (metis-loop 8c30fda), edit, since, display/line and the
          # README's mechanical parts (loop-fixes s-855d8067), and take carrying the
          # files a program includes (rddl-worlds s-242c7c3f: a package seed); sdk-v0.1.6:
          # take carries a manifest's notch and keeps every file's bytes (CRLF), a notch
          # never edited (release-check s-7dc259fc: the pin follows the newest tag); sdk-v0.1.9:
          # the root is the cwd, state() = DIR/.metis/, installed() (cwd-root s-ddac2cbf); sdk-v0.1.10:
          # the loop's policy, metis_loop_sdk.gate and its face ts/gate.ts (loop-parity s-72d9d36b)
          pip install "metis-loop-sdk @ git+https://github.com/metis-lang-dev/metis-loop@sdk-v0.1.10#subdirectory=sdk"
          python -m metis_loop_sdk.catalog intents --help | grep -q -- --spec
          python -m metis_loop_sdk.catalog take --help > /dev/null
          python -m metis_loop_sdk.catalog edit --help | grep -q -- --replace-all
          python -m metis_loop_sdk.catalog readme --help | grep -q -- --summary
          python -c "from metis_loop_sdk import catalog; assert catalog.includes and catalog.state and catalog.installed"
          python -m metis_loop_sdk.catalog installed --json
          python -m metis_loop_sdk.gate --help > /dev/null
          python -m metis_loop_sdk.catalog ts --json | grep -q gate.ts
          python -c "from metis.loop.wire import reload_shell"      # metispy's wire reload (the rescue in the kernel)
          python -m metis_loop_sdk.models openai-command --help > /dev/null
          python -c "import metis_loop_sdk.models.openai, metis_loop_sdk.catalog; print('sdk', metis_loop_sdk.__version__)"
      # nav's and wildfire's hosts step the IPPC gym in an interpreter of their own: pyRDDLGym and
      # rddlrepository, public on PyPI (MIT), pinned as the packages' .venv has them; ~15 s
      - name: The gym for the RDDL packages' hosts (its own venv, METIS_RDDL_PY)
        run: |
          python -m venv /tmp/gym
          /tmp/gym/bin/pip install -q pyRDDLGym==2.7 rddlrepository==2.2
          echo "METIS_RDDL_PY=/tmp/gym/bin/python" >> "$GITHUB_ENV"
      - name: 'Node and pi, pinned (setup.sh: checksummed node, npm ci from the lock)'
        working-directory: metis-agentic-loop
        run: ./setup.sh
      - name: Shell syntax
        working-directory: metis-agentic-loop
        run: bash -n setup.sh pi.sh loop.sh take.sh demo.sh example/lamp/world.sh
      - name: node tests
        working-directory: metis-agentic-loop
        run: |
          export REAL_METIS="$(command -v metis)" TEST_AGENT_PY="$(command -v python)" TEST_SDK_PY="$(command -v python)" TEST_REQUIRE_METISC=1
          export TEST_REQUIRE_AGENT=1 TEST_REQUIRE_GYM=1
          # the fixtures' catalog (love_triangle, nav): the checkout, named (the installed wheel has no ceptre/)
          export TEST_CATALOG="$GITHUB_WORKSPACE/metis-catalog"
          ./node/bin/node --experimental-strip-types --test test/extensions.test.ts
